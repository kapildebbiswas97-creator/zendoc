{% extends "base.html" %}
{% block title %}Reset Password — ZENDOC{% endblock %}

{% block content %}
<section class="auth-panel">
  <p class="eyebrow">Secure Reset</p>
  <h1>Reset Password</h1>
  <p class="section-copy">Enter your password reset token and choose a new password.</p>

  <form method="post" action="{{ url_for('main.reset_password') }}" style="margin-top:20px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    
    <label>Reset Token
      <input type="text" name="token" value="{{ token or '' }}" required>
    </label>

    <label style="margin-top:12px;">New Password (at least 8 characters)
      <input type="password" name="password" minlength="8" required>
    </label>

    <div class="form-actions" style="margin-top:16px;">
      <button type="submit" class="primary-action" style="width:100%;">Set New Password</button>
    </div>
  </form>
</section>
{% endblock %}
