{% extends "base.html" %}

{% block title %}{{ display_user }} Login{% endblock %}

{% block content %}
<section class="auth-panel">
    <h1>{{ display_user }} Login</h1>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Email
            <input name="email" type="email" placeholder="you@example.com" required>
        </label>
        <label>Password
            <input name="password" type="password" placeholder="Your password" required>
        </label>
        <button type="submit">Login</button>
    </form>

    {% if user != 'admin' %}
        <a class="text-link" href="{{ url_for('register', user=user) }}">New user? Register here</a>
    {% endif %}
</section>
{% endblock %}
