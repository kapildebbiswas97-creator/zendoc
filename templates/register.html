{% extends "base.html" %}

{% block title %}{{ display_user }} Register{% endblock %}

{% block content %}
<section class="auth-panel">
    <h1>{{ display_user }} Register</h1>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Full Name
            <input name="name" placeholder="Full name" required>
        </label>
        <label>Email
            <input name="email" type="email" placeholder="you@example.com" required>
        </label>
        <label>Phone
            <input name="phone" placeholder="Optional phone number">
        </label>
        <label>Age
            <input name="age" type="number" min="0" max="130" placeholder="Optional age">
        </label>
        <label>Password
            <input name="password" type="password" minlength="8" placeholder="At least 8 characters" required>
        </label>
        <button type="submit">Register</button>
    </form>

    <a class="text-link" href="{{ url_for('login', user=user) }}">Already registered? Login</a>
</section>
{% endblock %}
