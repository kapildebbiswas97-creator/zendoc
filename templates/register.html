{% extends "base.html" %}
{% block title %}{{ role.title() }} Register{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>{{ role.title() }} Register</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Full Name <input name="name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password <input name="password" type="password" minlength="8" required></label>
    <label>Phone <input name="phone"></label>
    <label>Age <input name="age" type="number" min="0" max="130"></label>
    <label>Gender <input name="gender"></label>
    <label>City <input name="city"></label>
    <label>Emergency Contact <input name="emergency_contact"></label>
    <button type="submit">Register</button>
  </form>
</section>
{% endblock %}
