{% extends "base.html" %}
{% block title %}Forgot Password — ZENDOC{% endblock %}

{% block content %}
<section class="auth-panel">
  <p class="eyebrow">Account Recovery</p>
  <h1>Forgot Password</h1>
  <p class="section-copy">Enter your registered email address to receive password reset instructions.</p>

  <form method="post" action="{{ url_for('main.forgot_password') }}" style="margin-top:20px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    
    <label>Registered Email Address
      <input type="email" name="email" placeholder="name@example.com" required autofocus>
    </label>

    <div class="form-actions" style="margin-top:16px;">
      <button type="submit" class="primary-action" style="width:100%;">Generate Reset Token</button>
    </div>
  </form>

  <div style="margin-top:20px;text-align:center;">
    <a href="{{ url_for('main.login', role='patient') }}" class="text-link">&larr; Back to Login</a>
  </div>
</section>
{% endblock %}
