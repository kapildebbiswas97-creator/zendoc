name: ZENDOC Production Sentinel

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Optional public ZENDOC URL; falls back to repository variable ZENDOC_DEPLOYMENT_URL"
        required: false
        type: string
      expected_commit:
        description: "Optional exact deployed commit to require"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: zendoc-production-sentinel
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  verify-production:
    name: Verify live production and manage incident
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deployment_url != '') || vars.ZENDOC_DEPLOYMENT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url || vars.ZENDOC_DEPLOYMENT_URL }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit || vars.ZENDOC_EXPECTED_COMMIT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify OCI/PostgreSQL deployment identity and persistence
        id: deployment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$DEPLOYMENT_URL"
            --require-platform oci
            --require-engine postgresql
            --require-persistence-verified
            --attempts 4
            --interval 20
          )
          if [[ -n "${EXPECTED_COMMIT:-}" ]]; then
            args+=(--expected-commit "$EXPECTED_COMMIT")
          fi
          python scripts/verify_deployment.py "${args[@]}"

      - name: Verify public web, PWA, account and security contracts
        id: public
        continue-on-error: true
        run: python scripts/verify_public_launch.py "$DEPLOYMENT_URL" --timeout 20

      - name: Open or update production incident
        if: steps.deployment.outcome != 'success' || steps.public.outcome != 'success'
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
          DEPLOYMENT_URL: ${{ env.DEPLOYMENT_URL }}
        with:
          script: |
            const title = 'Production Sentinel: live verification failing';
            const marker = '<!-- zendoc-production-sentinel -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const safeBody = [
              marker,
              'ZENDOC Production Sentinel detected a failed live verification.',
              '',
              `Deployment verification: **${process.env.DEPLOYMENT_OUTCOME}**`,
              `Public launch verification: **${process.env.PUBLIC_OUTCOME}**`,
              `Public URL: ${process.env.DEPLOYMENT_URL}`,
              `Workflow run: ${runUrl}`,
              '',
              'No credentials, request bodies, medical content, or raw production exceptions are copied into this issue.',
              'Investigate the workflow logs, fix through a reviewed branch/PR, pass the Production Gate, then verify the exact live artifact.'
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: safeBody
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: safeBody
              });
            }

      - name: Close production incident after verified recovery
        if: steps.deployment.outcome == 'success' && steps.public.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Production Sentinel: live verification failing';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Production Sentinel verified recovery. Deployment and public-launch checks both passed. Run: ${runUrl}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Preserve failing workflow signal
        if: steps.deployment.outcome != 'success' || steps.public.outcome != 'success'
        run: |
          echo "Production Sentinel detected a live release failure."
          exit 1
