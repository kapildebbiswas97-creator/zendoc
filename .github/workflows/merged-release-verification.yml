name: ZENDOC Merged Release Verification

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Optional Vercel public URL for OCI-backed deployment verification"
        required: false
        type: string
      expected_commit:
        description: "Optional commit SHA to verify"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zendoc-merged-release-verification
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  verify-oci-backed-public-release:
    name: Verify merged release through Vercel → OCI
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        vars.ZENDOC_DEPLOYMENT_URL != ''
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.deployment_url != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url || vars.ZENDOC_DEPLOYMENT_URL }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify exact merged release through the public Vercel gateway
        run: >-
          python scripts/verify_deployment.py "$DEPLOYMENT_URL"
          --expected-commit "$EXPECTED_COMMIT"
          --require-platform oci
          --require-engine postgresql
          --require-persistence-verified
          --attempts 40
          --interval 15
      - name: Verify public web, PWA, policy and security contracts
        run: python scripts/verify_public_launch.py "$DEPLOYMENT_URL" --timeout 20
