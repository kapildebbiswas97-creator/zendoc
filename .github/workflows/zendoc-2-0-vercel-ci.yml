name: ZENDOC 2.0 Vercel & Supabase CI

on:
  push:
    branches:
      - rebuild/zendoc-2.0-vercel
  pull_request:
    branches:
      - rebuild/zendoc-2.0-vercel

jobs:
  verify:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run automated test suite
        run: npm run test

      - name: Verify TypeScript & Next.js production build
        run: npm run build
