name: ZENDOC Production Gate

on:
  push:
    branches: [main, post-submission-production, competition/edgecare-ai-2026]
  pull_request:
    branches: [main, post-submission-production]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Optional Render base URL for deployment health verification"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zendoc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  ZENDOC_CREATE_DEV_ADMIN: "false"
  ZENDOC_LOCAL_AI_ENABLED: "false"
  ZENDOC_MODEL_EVALUATION_REAL_ENABLED: "false"
  ZENDOC_PLACES_PROVIDER: "none"
  ZENDOC_VIDEO_PROVIDER: "none"

jobs:
  critical-safety-security:
    name: Critical Safety & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZENDOC_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q zendoc tests
      - name: Run critical safety/security regressions
        run: >
          python -m pytest -q
          tests/test_security_hardening_v3.py
          tests/test_provider_permission_matrix_v1.py
          tests/test_provider_tenancy_v1.py
          tests/test_provider_resource_tenancy_v1.py
          tests/test_workflow_state_integrity_v1.py
          tests/test_concurrency_integrity_v1.py
          tests/test_database_reliability_v1.py
          tests/test_observability_incident_v1.py
          tests/test_release_gate_v1.py
          tests/test_careloop_consent_scope_boundary.py
          tests/test_care_action_provider_state_truth.py
          tests/test_health_memory_rag_v1.py
          tests/test_public_launch_v1.py
          tests/test_email_delivery_v1.py
          tests/test_submission_smoke_matrix_v1.py
          tests/test_telehealth_truth_v1.py
          tests/test_policy_acceptance_v1.py
          tests/test_email_verification_v1.py
          tests/test_public_registration_roles_v1.py
          tests/test_provider_invitation_v1.py
          tests/test_public_provider_verification_gate_v1.py
          tests/test_software_completion_gate_v1.py
          tests/test_api_token_lifecycle_v1.py
          tests/test_auth_rate_limit_v1.py
          tests/test_account_export_v1.py
          tests/test_symptom_guidance_boundary_v1.py
          tests/test_iot_provenance_truth_v1.py
          tests/test_pharmacy_truth_v1.py
          tests/test_request_fulfilment_truth_v1.py
          tests/test_public_catalog_truth_v1.py

  full-sqlite-tests:
    name: Full SQLite Test Suite
    runs-on: ubuntu-latest
    # The complete regression suite is intentionally broad and can exceed 20 minutes
    # on a shared runner; keep the gate bounded while allowing it to finish.
    timeout-minutes: 35
    env:
      ZENDOC_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q zendoc tests scripts
      - name: Run full suite
        run: python -m pytest -q

  postgres-production-smoke:
    name: PostgreSQL Production Migration & Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zendoc
          POSTGRES_PASSWORD: zendoc_ci_password
          POSTGRES_DB: zendoc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zendoc -d zendoc_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ZENDOC_ENV: production
      DATABASE_URL: postgresql://zendoc:zendoc_ci_password@127.0.0.1:5432/zendoc_ci
      ZENDOC_PERSISTENCE_VERIFIED: "true"
      ZENDOC_SECRET_KEY: ci-only-secret-key-that-is-not-used-outside-ci
      ZENDOC_ADMIN_EMAIL: owner-ci@example.invalid
      ZENDOC_ADMIN_PASSWORD: CI-Only-Strong-Password-12345
      ZENDOC_REQUIRE_DURABLE_DATABASE: "true"
      ZENDOC_CONNECTED_CARE_DATA_MODE: LIVE
      ZENDOC_CI_FIXTURES: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Production PostgreSQL smoke
        run: python scripts/ci_postgres_readiness.py

  static-security:
    name: Static Security & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZENDOC_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "bandit>=1.7,<2" "pip-audit>=2.7,<3"
      - name: Repository secret-pattern gate
        run: python scripts/ci_secret_scan.py
      - name: High-confidence high-severity static scan
        run: bandit -r zendoc -q -lll -iii
      - name: Dependency vulnerability audit
        run: |
          for attempt in 1 2 3; do
            if pip-audit -r requirements.txt; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "pip-audit attempt $attempt failed; retrying after transient-error backoff..."
            sleep $((attempt * 5))
          done

  release-readiness:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - critical-safety-security
      - full-sqlite-tests
      - postgres-production-smoke
      - static-security
    if: always()
    steps:
      - name: Enforce all blocking jobs
        env:
          CRITICAL: ${{ needs.critical-safety-security.result }}
          SQLITE: ${{ needs.full-sqlite-tests.result }}
          POSTGRES: ${{ needs.postgres-production-smoke.result }}
          SECURITY: ${{ needs.static-security.result }}
        run: |
          echo "critical-safety-security=$CRITICAL"
          echo "full-sqlite-tests=$SQLITE"
          echo "postgres-production-smoke=$POSTGRES"
          echo "static-security=$SECURITY"
          test "$CRITICAL" = "success"
          test "$SQLITE" = "success"
          test "$POSTGRES" = "success"
          test "$SECURITY" = "success"

  deployment-verification:
    name: Deployment Health Verification
    runs-on: ubuntu-latest
    needs: release-readiness
    if: >-
      needs.release-readiness.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.deployment_url != ''
        )
      )
    timeout-minutes: 12
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url || vars.ZENDOC_DEPLOYMENT_URL || 'https://zendoc-ykax.onrender.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify deployed liveness/readiness and exact release identity
        run: >
          python scripts/verify_deployment.py "$DEPLOYMENT_URL"
          --expected-commit "${{ github.sha }}"
          --require-platform render
          --require-engine postgresql
          --require-persistence-verified
          --attempts 40
          --interval 15
