services:
  - type: web
    name: zendoc
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ZENDOC_ENV
        value: production
      - key: ZENDOC_SECRET_KEY
        sync: false
      - key: ZENDOC_ADMIN_EMAIL
        sync: false
      - key: ZENDOC_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ZENDOC_PERSISTENCE_VERIFIED
        value: "false"
      - key: ZENDOC_REQUIRE_DURABLE_DATABASE
        value: "false"
      - key: ZENDOC_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: ZENDOC_RATE_LIMIT_PER_MINUTE
        value: "120"
